<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1014" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Zuhause</title>
<style>
  :root{
    --bg:#0e1014; --bg2:#151a22; --card:#1b212b; --card2:#222b38;
    --txt:#f2f5f9; --muted:#8b97a8; --line:#2a3340;
    --accent:#5b8cff; --warm:#ffb64d; --cool:#4db6ff; --heat:#ff7a59; --ok:#43d17a; --danger:#ff5c6c;
    --radius:24px; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%, var(--bg2), var(--bg)) fixed;
    color:var(--txt); min-height:100dvh; overflow-x:hidden;}
  .app{max-width:540px; margin:0 auto; padding:20px 16px 110px; min-height:100dvh;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  .hidden{display:none!important;}

  /* Login */
  .login{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(900px 500px at 50% 0%, var(--bg2), var(--bg)); padding:26px; z-index:40;}
  .login .logo{font-size:52px; margin-bottom:8px;}
  .login h2{margin:0 0 4px; font-size:23px;}
  .login p{color:var(--muted); margin:0 0 24px; font-size:14px;}
  .login input{width:100%; max-width:320px; padding:15px 16px; font-size:17px; border:1px solid var(--line);
    border-radius:14px; background:var(--card); color:var(--txt); margin-bottom:12px;}
  .login .btn{width:100%; max-width:320px;}
  .btn{padding:15px 16px; font-size:16px; font-weight:650; border-radius:14px; background:var(--accent); color:#fff;}
  .btn:active{transform:scale(.98);}
  .err{color:var(--danger); font-size:14px; min-height:20px; margin-top:6px;}

  /* Header */
  .top{display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:16px;}
  .greet{font-size:25px; font-weight:700; letter-spacing:-.02em; line-height:1.1;}
  .sub{font-size:13px; color:var(--muted); margin-top:3px;}
  .toprow{display:flex; gap:10px;}
  .iconbtn{width:42px; height:42px; border-radius:50%; background:var(--card); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center; font-size:17px;}

  /* Hero (Musik) */
  .hero{background:linear-gradient(140deg,#2b3550,#1c2740); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px;}
  .hero .t{font-size:16px; font-weight:650;}
  .hero .s{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .hero .acts{display:flex; gap:8px;}
  .hero button{border-radius:12px; padding:11px 15px; font-size:14px; font-weight:650;}
  .hero .on{background:var(--accent); color:#fff;}
  .hero .stop{background:var(--card2); color:var(--txt);}

  /* Floor + room tabs */
  .floors{display:flex; flex-wrap:wrap; gap:8px; padding:2px 0 10px;}
  .fchip{padding:9px 15px; border-radius:14px; background:transparent; font-size:13px; font-weight:700;
    color:var(--muted); border:1.6px solid var(--line);}
  .fchip.active{background:var(--txt); color:var(--bg); border-color:var(--txt);}
  .rooms{display:flex; flex-wrap:wrap; gap:9px; padding:2px 0 14px;}
  .chip{padding:9px 15px; border-radius:16px; background:var(--card); font-size:14px; font-weight:550;
    color:var(--muted); box-shadow:var(--shadow);}
  .chip.active{background:var(--accent); color:#fff;}

  /* Tiles */
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:13px;}
  .tile{background:var(--card); border-radius:var(--radius); padding:15px; box-shadow:var(--shadow);
    min-height:118px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; position:relative;}
  .tile.on{background:linear-gradient(150deg,#3a2f18,#2a2410);}
  .tile .thead{display:flex; align-items:flex-start; justify-content:space-between;}
  .tile .emoji{width:42px; height:42px; border-radius:13px; background:var(--card2); display:flex;
    align-items:center; justify-content:center; font-size:21px;}
  .tile.on .emoji{background:rgba(255,182,77,.22);}
  .tile .name{font-size:14.5px; font-weight:600; line-height:1.25; margin-top:12px; word-break:break-word;}
  .tile .state{font-size:12px; color:var(--muted); margin-top:2px;}
  .tile .state.warn{color:var(--warm);}
  .mini{width:40px; height:26px; border-radius:16px; background:var(--line); position:relative; flex:none; transition:.2s;}
  .mini .k{position:absolute; top:2px; left:2px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s;}
  .mini.on{background:var(--ok);} .mini.on .k{left:16px;}
  .cbtns{display:flex; gap:6px; margin-top:10px;}
  .cbtn{flex:1; padding:8px 0; border-radius:10px; background:var(--card2); font-size:13px; font-weight:650; text-align:center;}
  .cbtn.act{background:var(--accent); color:#fff;}
  .temp{font-size:26px; font-weight:700; margin-top:8px;}
  .temp small{font-size:13px; color:var(--muted); font-weight:600;}
  .empty{grid-column:1/-1; text-align:center; color:var(--muted); padding:34px 10px; font-size:14px;}
  .sec{font-size:12px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); font-weight:700; margin:20px 2px 10px;}

  /* Presence */
  .pillrow{display:flex; flex-wrap:wrap; gap:8px;}
  .pill{padding:9px 13px; border-radius:999px; font-size:13px; font-weight:600; background:var(--card); color:var(--muted);}
  .pill.home{background:rgba(67,209,122,.16); color:var(--ok);}
  .pill .dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:currentColor; margin-right:7px; vertical-align:middle;}

  /* Rules */
  .builder{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:8px;}
  .builder label{display:block; font-size:12px; color:var(--muted); font-weight:650; margin:0 0 6px;}
  .builder select{width:100%; padding:13px 14px; font-size:16px; border:1px solid var(--line); border-radius:12px;
    background:var(--card2); color:var(--txt); margin-bottom:12px; -webkit-appearance:none; appearance:none;}
  .builder .arrow{text-align:center; color:var(--accent); font-size:18px; margin:-4px 0 8px;}
  .builder .btn{width:100%;}
  .rule{background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:12px 14px; margin-bottom:10px;
    display:flex; align-items:center; gap:12px;}
  .rule .grow{flex:1; min-width:0;}
  .rule .nm{font-weight:600; font-size:14.5px; line-height:1.3;}
  .rule .st{font-size:11.5px; color:var(--muted); margin-top:2px;}

  /* Bottom nav */
  nav.tabs{position:fixed; bottom:0; left:0; right:0; background:rgba(20,26,34,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); display:flex; max-width:540px; margin:0 auto;
    padding:8px 0 calc(env(safe-area-inset-bottom) + 8px); z-index:20;}
  nav.tabs button{flex:1; padding:6px 0; font-size:11px; color:var(--muted);}
  nav.tabs button .ni{display:block; font-size:21px; line-height:1; margin-bottom:2px;}
  nav.tabs button.active{color:var(--accent); font-weight:700;}

  .toast{position:fixed; left:50%; bottom:82px; transform:translateX(-50%); background:#000; color:#fff;
    padding:11px 18px; border-radius:12px; font-size:14px; opacity:0; transition:.25s; z-index:30; max-width:86%; text-align:center;}
  .toast.show{opacity:.95;}
  .spin{text-align:center; padding:40px; color:var(--muted);}
</style>
</head>
<body>

<div id="login" class="login">
  <div class="logo">🏠</div>
  <h2>Zuhause</h2>
  <p>Bitte Passwort eingeben</p>
  <input id="pw" type="password" placeholder="Passwort" autocomplete="current-password" />
  <button class="btn" onclick="doLogin()">Anmelden</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="app hidden">
  <div class="top">
    <div>
      <div class="greet" id="greet">Willkommen</div>
      <div class="sub" id="sub">Angemeldet</div>
    </div>
    <div class="toprow">
      <button class="iconbtn" onclick="refresh()" title="Aktualisieren">↻</button>
      <button class="iconbtn" onclick="logout()" title="Abmelden">🔒</button>
    </div>
  </div>

  <!-- Zuhause -->
  <section id="tab-home">
    <div id="hero"></div>
    <div class="floors" id="floors"></div>
    <div class="rooms" id="rooms"></div>
    <div class="grid" id="tiles"><div class="spin">Lädt…</div></div>
    <div class="sec">Wer ist zuhause</div>
    <div class="pillrow" id="presence"></div>
  </section>

  <!-- Regeln -->
  <section id="tab-rules" class="hidden">
    <div class="sec">Neue Regel bauen</div>
    <div class="builder">
      <label>Wenn…</label>
      <select id="selTrigger"></select>
      <div class="arrow">↓</div>
      <label>dann…</label>
      <select id="selAction"></select>
      <button class="btn" onclick="createRule()">Regel erstellen</button>
      <div id="ruleErr" class="err"></div>
    </div>
    <div class="sec">Bestehende Regeln</div>
    <div id="rulesBody"><div class="spin">Lädt…</div></div>
  </section>

  <nav class="tabs">
    <button id="nav-home" class="active" onclick="showTab('home')"><span class="ni">🏠</span>Zuhause</button>
    <button id="nav-rules" onclick="showTab('rules')"><span class="ni">⚡</span>Regeln</button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<script>
const $ = s => document.querySelector(s);
let TOKEN = localStorage.getItem("haus_token") || "";
let DATA = null, curFloor = null, curRoom = null, TAB = "home";

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

async function api(path, opts={}){
  opts.headers = Object.assign({"Content-Type":"application/json","X-Auth":TOKEN}, opts.headers||{});
  const r = await fetch(path, opts);
  if(r.status===401){ logout(); throw new Error("Nicht angemeldet"); }
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || ("Fehler "+r.status));
  return j;
}

/* Auth */
async function doLogin(){
  $("#loginErr").textContent="";
  try{
    const j = await (await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({password:$("#pw").value})})).json();
    if(j.token){ TOKEN=j.token; localStorage.setItem("haus_token",TOKEN); enterApp(); }
    else $("#loginErr").textContent = j.error || "Falsches Passwort";
  }catch(e){ $("#loginErr").textContent="Anmeldung fehlgeschlagen"; }
}
$("#pw").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
function logout(){ TOKEN=""; localStorage.removeItem("haus_token"); $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); }
function enterApp(){ $("#login").classList.add("hidden"); $("#app").classList.remove("hidden");
  const h=new Date().getHours(); const g=h<11?"Guten Morgen":h<18?"Hallo":"Guten Abend";
  $("#greet").textContent=g+", Andre"; $("#sub").textContent="Zuhause";
  showTab("home"); loadRules(); }

/* Tabs */
function showTab(t){ TAB=t;
  $("#tab-home").classList.toggle("hidden",t!=="home");
  $("#tab-rules").classList.toggle("hidden",t!=="rules");
  $("#nav-home").classList.toggle("active",t==="home");
  $("#nav-rules").classList.toggle("active",t==="rules");
  if(t==="home") loadHome();
}
function refresh(){ TAB==="home" ? loadHome() : loadRules(); }

/* Home */
async function loadHome(){
  try{
    const [rooms, dash] = await Promise.all([api("/api/rooms"), api("/api/dashboard")]);
    DATA = rooms; renderHero(dash); renderPresence(dash);
    if(!curFloor || !DATA.floors.some(f=>f.name===curFloor)) curFloor = DATA.floors[0] && DATA.floors[0].name;
    renderFloors(); renderRooms(); renderTiles();
  }catch(e){ $("#tiles").innerHTML='<div class="empty">'+e.message+'</div>'; }
}

function renderHero(d){
  const m=(d.favorites||[]).find(f=>f.type==="media");
  const playing=m&&m.state==="playing";
  $("#hero").innerHTML='<div><div class="t">🎵 Küche</div><div class="s">'
    +(playing?"Läuft gerade":"Aus")+'</div></div><div class="acts">'
    +'<button class="on" onclick="schlager()">Schlager an</button>'
    +'<button class="stop" onclick="mediaStop()">Aus</button></div>';
}
function renderPresence(d){
  const p=d.persons||[];
  $("#presence").innerHTML = p.length ? p.map(x=>'<span class="pill'+(x.home?" home":"")
    +'"><span class="dot"></span>'+esc(x.name)+' · '+(x.home?"zuhause":"weg")+'</span>').join("")
    : '<span class="empty">—</span>';
}
function renderFloors(){
  $("#floors").innerHTML = DATA.floors.map(f=>'<button class="fchip'+(f.name===curFloor?" active":"")
    +'" onclick="pickFloor(\''+f.name+'\')">'+esc(f.name)+'</button>').join("");
}
function pickFloor(f){ curFloor=f; curRoom=null; renderFloors(); renderRooms(); renderTiles(); }
function renderRooms(){
  const fl=DATA.floors.find(f=>f.name===curFloor); if(!fl){ $("#rooms").innerHTML=""; return; }
  if(!curRoom || !fl.rooms.some(r=>r.name===curRoom)) curRoom=fl.rooms[0] && fl.rooms[0].name;
  $("#rooms").innerHTML = fl.rooms.map(r=>'<button class="chip'+(r.name===curRoom?" active":"")
    +'" onclick="pickRoom(\''+r.name.replace(/'/g,"\\'")+'\')">'+esc(r.name)+'</button>').join("");
}
function pickRoom(r){ curRoom=r; renderRooms(); renderTiles(); }

function emojiFor(dev){
  const n=(dev.name||"").toLowerCase();
  if(dev.domain==="cover") return /garage|tor/.test(n)?"🚗":"🪟";
  if(dev.domain==="climate") return "🌡️";
  if(dev.domain==="media_player") return "🔊";
  if(dev.domain==="switch") return "🔌";
  return "💡";
}
function stateLabel(s){const m={on:"An",off:"Aus",open:"Offen",closed:"Zu",opening:"Öffnet…",closing:"Schließt…",
  playing:"Läuft",paused:"Pause",idle:"Bereit",unavailable:"Offline",standby:"Standby",heat:"Heizen",cool:"Kühlen"};return m[s]||s||"—";}

function renderTiles(){
  const fl=DATA.floors.find(f=>f.name===curFloor);
  const rm=fl&&fl.rooms.find(r=>r.name===curRoom);
  if(!rm){ $("#tiles").innerHTML='<div class="empty">Keine Geräte</div>'; return; }
  $("#tiles").innerHTML = rm.devices.map(tile).join("") || '<div class="empty">Keine Geräte</div>';
}
function tile(d){
  const off=d.state==="unavailable";
  const em='<div class="emoji">'+emojiFor(d)+'</div>';
  if(d.domain==="light"||d.domain==="switch"){
    const on=d.state==="on";
    return '<div class="tile'+(on?" on":"")+'"><div class="thead">'+em
      +'<div class="mini'+(on?" on":"")+'" onclick="toggleDev(\''+d.domain+'\',\''+d.entity_id+'\','+(!on)+')"><div class="k"></div></div></div>'
      +'<div><div class="name">'+esc(d.name)+'</div><div class="state'+(off?" warn":"")+'">'+stateLabel(d.state)+'</div></div></div>';
  }
  if(d.domain==="cover"){
    const open=d.state==="open";
    return '<div class="tile"><div class="thead">'+em+'</div>'
      +'<div class="name">'+esc(d.name)+'</div><div class="state'+(off?" warn":"")+'">'+stateLabel(d.state)+'</div>'
      +'<div class="cbtns"><div class="cbtn'+(open?"":" act")+'" onclick="cover(\''+d.entity_id+'\',\'open\')">Auf</div>'
      +'<div class="cbtn'+(open?" act":"")+'" onclick="cover(\''+d.entity_id+'\',\'close\')">Zu</div></div></div>';
  }
  if(d.domain==="climate"){
    const t=d.current_temperature!=null?d.current_temperature:"–";
    return '<div class="tile"><div class="thead">'+em+'</div><div class="name">'+esc(d.name)+'</div>'
      +'<div class="temp">'+t+'<small>°C</small></div></div>';
  }
  // media
  return '<div class="tile"><div class="thead">'+em+'</div><div class="name">'+esc(d.name)+'</div>'
    +'<div class="state">'+stateLabel(d.state)+'</div></div>';
}

/* Actions */
async function toggleDev(domain,id,on){ try{ await api("/api/service",{method:"POST",
  body:JSON.stringify({domain:domain,service:on?"turn_on":"turn_off",entity_id:id})});
  toast(on?"An":"Aus"); setTimeout(loadHome,700);}catch(e){toast(e.message);} }
async function cover(id,dir){ try{ await api("/api/service",{method:"POST",
  body:JSON.stringify({domain:"cover",service:dir==="open"?"open_cover":"close_cover",entity_id:id})});
  toast(dir==="open"?"Öffne…":"Schließe…"); setTimeout(loadHome,1500);}catch(e){toast(e.message);} }
async function schlager(){ try{ await api("/api/quick/schlager",{method:"POST"});
  toast("Schlager läuft 🎵"); setTimeout(loadHome,1200);}catch(e){toast(e.message);} }
async function mediaStop(){ try{ await api("/api/service",{method:"POST",
  body:JSON.stringify({domain:"media_player",service:"media_stop",entity_id:"media_player.kuche"})});
  toast("Aus"); setTimeout(loadHome,900);}catch(e){toast(e.message);} }

/* Rules */
async function loadRules(){
  try{
    const [b,a]=await Promise.all([api("/api/rules/blocks"),api("/api/automations")]);
    $("#selTrigger").innerHTML=b.triggers.map(t=>'<option value="'+t.key+'">'+esc(t.label)+'</option>').join("");
    $("#selAction").innerHTML=b.actions.map(x=>'<option value="'+x.key+'">'+esc(x.label)+'</option>').join("");
    renderRules(a.automations);
  }catch(e){ $("#rulesBody").innerHTML='<div class="empty">'+e.message+'</div>'; }
}
function renderRules(list){
  if(!list||!list.length){ $("#rulesBody").innerHTML='<div class="empty">Keine Regeln</div>'; return; }
  $("#rulesBody").innerHTML=list.map(a=>{
    const on=a.state==="on";
    const lt=a.last_triggered?new Date(a.last_triggered).toLocaleString("de-DE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"noch nie";
    return '<div class="rule"><div class="grow"><div class="nm">'+esc(a.name)+'</div><div class="st">zuletzt: '+lt+'</div></div>'
      +'<div class="mini'+(on?" on":"")+'" onclick="toggleRule(\''+a.entity_id+'\','+(!on)+')"><div class="k"></div></div></div>';
  }).join("");
}
async function toggleRule(id,on){ try{ await api("/api/automations/toggle",{method:"POST",
  body:JSON.stringify({entity_id:id,enable:on})}); toast(on?"Regel aktiv":"Regel aus"); loadRules();}catch(e){toast(e.message);} }
async function createRule(){ $("#ruleErr").textContent="";
  try{ const j=await api("/api/rules/simple",{method:"POST",body:JSON.stringify({trigger:$("#selTrigger").value,action:$("#selAction").value})});
    toast("Regel erstellt"); loadRules();}catch(e){ $("#ruleErr").textContent=e.message; } }

function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

if(TOKEN) enterApp();
</script>
</body>
</html>
